databases:
  - name: summarist_db
    plan: free
    databaseName: summarist_projectdb
    user: summarist_project

services:
  - type: web
    plan: free
    name: summarist_project
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn summarist_project.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: summarist_projectdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4